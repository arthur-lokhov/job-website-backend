openapi: 3.0.3
info:
  title: Job Website API
  description: API для сайта вакансий с публичной и админ частями
  version: 1.0.0
servers:
  - url: /api/v1
    description: Основной API сервер

tags:
  - name: Public
    description: Публичные эндпоинты для основного сайта
  - name: Private
    description: Защищенные эндпоинты для админ панели
    x-displayName: Admin

paths:
  /vacancies:
    get:
      summary: Получить список активных вакансий
      description: Возвращает только активные вакансии с базовой информацией для отображения на сайте
      tags:
        - Public
      parameters:
        - $ref: '#/components/parameters/prioritySort'
        - $ref: '#/components/parameters/importantFilter'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicVacanciesList'
        '500':
          $ref: '#/components/responses/ServerError'

  /vacancies/{id}:
    get:
      summary: Получить детальную информацию о вакансии
      tags:
        - Public
      parameters:
        - $ref: '#/components/parameters/vacancyId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicVacancyDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /vacancies/{id}/form:
    get:
      summary: Получить форму отклика на вакансию
      description: Возвращает динамическую форму для заполнения отклика
      tags:
        - Public
      parameters:
        - $ref: '#/components/parameters/vacancyId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationForm'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications:
    post:
      summary: Отправить отклик на вакансию
      tags:
        - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSubmitRequest'
      responses:
        '201':
          description: Отклик успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/vacancies:
    get:
      summary: Получить все вакансии (админ)
      description: Возвращает полную информацию по всем вакансиям
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/isActiveFilter'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVacanciesList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Создать новую вакансию
      tags:
        - Private
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyCreateRequest'
      responses:
        '201':
          description: Вакансия успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/vacancies/{id}:
    patch:
      summary: Обновить вакансию
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/vacancyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyUpdateRequest'
      responses:
        '200':
          description: Успешное обновление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Удалить вакансию
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/vacancyId'
      responses:
        '204':
          description: Вакансия успешно удалена
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/applications:
    get:
      summary: Получить все отклики
      description: Возвращает список всех откликов с возможностью фильтрации
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/vacancyIdFilter'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/applications/{id}:
    patch:
      summary: Обновить статус отклика
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/applicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationStatusUpdate'
      responses:
        '200':
          description: Статус успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Удалить отклик
      tags:
        - Private
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/applicationId'
      responses:
        '204':
          description: Отклик успешно удален
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    vacancyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID вакансии
    
    applicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID отклика
    
    prioritySort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Сортировка по приоритету
    
    importantFilter:
      name: important
      in: query
      required: false
      schema:
        type: boolean
      description: Фильтр по важным вакансиям
    
    isActiveFilter:
      name: isActive
      in: query
      required: false
      schema:
        type: boolean
      description: Фильтр по активности вакансии
    
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, VIEWED, INPROGRESS, APPROVED, REJECTED]
      description: Фильтр по статусу отклика
    
    vacancyIdFilter:
      name: vacancyId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Фильтр по ID вакансии

  schemas:
    PublicVacanciesList:
      type: array
      items:
        $ref: '#/components/schemas/PublicVacancyItem'
    
    PublicVacancyItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        name:
          type: string
          example: "Frontend Developer"
        location:
          $ref: '#/components/schemas/Location'
        department:
          $ref: '#/components/schemas/Department'
        level:
          $ref: '#/components/schemas/Level'
        logoUrl:
          type: string
          format: uri
          example: "https://example.com/logo.png"
        important:
          type: boolean
          example: true
        priority:
          type: integer
          example: 1
    
    PublicVacancyDetails:
      allOf:
        - $ref: '#/components/schemas/PublicVacancyItem'
        - type: object
          properties:
            photoUrl:
              type: string
              format: uri
              example: "https://example.com/photo.jpg"
            info:
              type: string
              example: "## Обязанности\n- Разработка SPA на React\n- Участие в code-review"
    
    ApplicationForm:
      type: object
      properties:
        formSchema:
          type: object
          description: JSON Schema формы
          example: {
            "type": "object",
            "properties": {
              "fullName": {"type": "string"},
              "email": {"type": "string", "format": "email"}
            }
          }
    
    ApplicationSubmitRequest:
      type: object
      required:
        - vacancyId
        - answers
      properties:
        vacancyId:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        answers:
          type: object
          description: Заполненные данные формы
          example: {"fullName": "Иван Иванов", "email": "test@example.com"}
    
    AdminVacanciesList:
      type: array
      items:
        $ref: '#/components/schemas/AdminVacancyItem'
    
    AdminVacancyItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        department:
          $ref: '#/components/schemas/Department'
        level:
          $ref: '#/components/schemas/Level'
        important:
          type: boolean
        priority:
          type: integer
        info:
          type: string
        applicationForm:
          $ref: '#/components/schemas/ApplicationForm'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    VacancyCreateRequest:
      type: object
      required:
        - name
        - locationId
        - departmentId
        - levelId
        - info
        - applicationForm
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        locationId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        info:
          type: string
          minLength: 10
        applicationForm:
          $ref: '#/components/schemas/ApplicationForm'
        important:
          type: boolean
          default: false
        priority:
          type: integer
          minimum: 0
          default: 0
        isActive:
          type: boolean
          default: true
    
    VacancyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        locationId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
        info:
          type: string
          minLength: 10
        applicationForm:
          $ref: '#/components/schemas/ApplicationForm'
        important:
          type: boolean
        priority:
          type: integer
          minimum: 0
        isActive:
          type: boolean
    
    ApplicationsList:
      type: array
      items:
        $ref: '#/components/schemas/ApplicationItem'
    
    ApplicationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vacancyId:
          type: string
          format: uuid
        vacancyName:
          type: string
        answers:
          type: object
        status:
          type: string
          enum: [PENDING, VIEWED, INPROGRESS, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time
    
    ApplicationStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, VIEWED, INPROGRESS, APPROVED, REJECTED]
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        id:
          type: string
          format: uuid
    
    CreatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
    
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    
    Level:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    
  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid request data"
    
    Unauthorized:
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Authentication required"
    
    Forbidden:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Access denied"
    
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Resource not found"
    
    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error"
